name: Benchmark

# A pull request runs the benchmark only when it carries the `benchmark` label (AGENTS.md says
# when one gets it): eight jobs, about 140 job-minutes, on the hosted-job cap that every repository
# of the sjawhar account shares. It runs every project except the 1,000-stage ones, so each job
# stays well under an hour. The weekly schedule and manual runs add the 1,000-stage projects.
on:
  pull_request:
    # ready_for_review: a draft runs no job of this workflow (every job below carries the draft
    # condition), so marking a pull request that carries `benchmark` ready is what runs them on its
    # head. Set the repository variable CI_RUN_DRAFT_PRS to `true` to run drafts again (the same
    # switch in pr-and-main.yaml).
    # labeled: adding `benchmark` to a ready pull request runs the jobs on its head; adding any
    # other label skips them. No `unlabeled`: removing `benchmark` starts no run, so a running
    # benchmark finishes, and the pull request's later pushes skip every job.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      base:
        description: Ref measured as the base (for an A/A run, the same as head)
        default: main
      head:
        description: Ref measured as the head
        default: main

env:
  UV_VERSION: 0.9.18
  # 48 keeps multi below the per-PR limit; thresholds use 3x the largest absolute median A/A change across every sample, with a 2% floor.
  BENCH_REPS: 48

# As in pr-and-main.yaml: the runs of one pull request cancel each other, so a push frees the
# runners of the run it replaced. The weekly run, a workflow_dispatch run (an A/A calibration
# sample among them) and a run that will skip every job each take a group of their own, the run
# id, so nothing cancels them and they cancel nothing. A pull-request run skips every job when the
# pull request is a draft, when it does not carry `benchmark`, or when the event adds another
# label, so adding an unrelated label never cancels a running benchmark. This condition and the
# `if` of both jobs are the same; change all three together. A test in benchmarks/test_workflow.py
# evaluates all three for each kind of event and fails when they disagree.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (github.event.pull_request.draft != true || vars.CI_RUN_DRAFT_PRS == 'true') && contains(github.event.pull_request.labels.*.name, 'benchmark') && (github.event.action != 'labeled' || github.event.label.name == 'benchmark') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs only read the repository, and no step after a checkout needs its git credentials.
permissions:
  contents: read

jobs:
  unit:
    if: >-
      github.event_name != 'pull_request' || (
      (github.event.pull_request.draft != true || vars.CI_RUN_DRAFT_PRS == 'true') &&
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark'))
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: uv sync --all-extras --all-groups --locked

      - name: Test the harness
        run: uv run pytest benchmarks -p no:randomly

  bench:
    if: >-
      github.event_name != 'pull_request' || (
      (github.event.pull_request.draft != true || vars.CI_RUN_DRAFT_PRS == 'true') &&
      contains(github.event.pull_request.labels.*.name, 'benchmark') &&
      (github.event.action != 'labeled' || github.event.label.name == 'benchmark'))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 240 }}
    name: bench (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        project: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '["multi","chain-10","chain-100","fan-10","fan-100","diamond-10","diamond-100"]'
          || '["multi","chain-10","chain-100","chain-1000","fan-10","fan-100","fan-1000","diamond-10","diamond-100","diamond-1000"]') }}

    steps:
      # A pull request is measured as GitHub merges it: the head is the merge commit, whose
      # workflow file and harness are the ones running, and the base is its first parent.
      - name: Check out the head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || inputs.head || 'main' }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the base
        id: base
        working-directory: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_SHA: ${{ github.sha }}
          INPUT_BASE: ${{ inputs.base }}
        run: |-
          if [ "$EVENT_NAME" = pull_request ]; then
            git rev-parse --verify "$MERGE_SHA^1"
            echo "ref=$(git rev-parse "$MERGE_SHA^1")" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_BASE" ]; then
            echo "ref=$INPUT_BASE" >> "$GITHUB_OUTPUT"
          else
            # The weekly run compares main with main as it was a week earlier.
            echo "ref=$(git rev-list -1 --before='7 days ago' origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.base.outputs.ref }}
          path: base
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "${{ env.UV_VERSION }}"
          enable-cache: true
          cache-dependency-glob: "*/uv.lock"

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: head/pyproject.toml

      - name: Build the base and the head in two venvs
        run: |-
          (cd base && uv sync --locked --no-dev --package pivot --compile-bytecode)
          (cd head && uv sync --locked --no-dev --package pivot --compile-bytecode)

      - name: Run base and head interleaved
        run: >-
          python head/benchmarks/run.py --project ${{ matrix.project }}
          --variant "base=$GITHUB_WORKSPACE/base/.venv/bin/pivot"
          --variant "head=$GITHUB_WORKSPACE/head/.venv/bin/pivot"
          --reps "$BENCH_REPS" --work "$RUNNER_TEMP/bench" --out-dir results

      - name: Upload both result files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-${{ matrix.project }}
          path: results/

      - name: Compare head with base
        run: >-
          python head/benchmarks/compare.py results/base.jsonl results/head.jsonl
          --threshold-file head/benchmarks/threshold.json

      - name: Thresholds this run would set (an A/A run's when base and head build the same pivot)
        if: always()
        run: python head/benchmarks/compare.py results/base.jsonl results/head.jsonl --derive-threshold
